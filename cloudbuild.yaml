steps:
  - name: 'gcr.io/cloud-builders/git'
    id: 'clone-repositories'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        chmod +x ./scripts/clone_repositories.sh
        ./scripts/clone_repositories.sh

  # Terraform drift detection
  - name: 'alpine:latest'
    id: 'drift-detection'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e

        # Install dependencies
        apk add --no-cache unzip wget jq bash

        # Install Terraform
        wget -qO /tmp/terraform.zip https://releases.hashicorp.com/terraform/${_TERRAFORM_VERSION}/terraform_${_TERRAFORM_VERSION}_linux_amd64.zip
        unzip /tmp/terraform.zip -d /usr/local/bin/
        
        # Install Terragrunt
        wget -qO /usr/local/bin/terragrunt \
          https://github.com/gruntwork-io/terragrunt/releases/download/v${_TERRAGRUNT_VERSION}/terragrunt_linux_amd64
        chmod +x /usr/local/bin/terragrunt

        # Initialize tracking files
        echo "false" > /workspace/drift_detected.txt
        echo "[]" > /workspace/drift_report.json

        # Function to find all directories with main.tf
        find_terraform_dirs() {
          local base_dir="$$1"
          find "$$base_dir" -type f -name "main.tf" -exec dirname {} \; | sort -u
        }

        # Function to find all directories with terragrunt.hcl
        find_terragrunt_dirs() {
          local base_dir="$$1"
          find "$$base_dir" -type f -name "terragrunt.hcl" -exec dirname {} \; | sort -u
        }

        # Function to get all workspaces
        get_workspaces() {
          local dir="$$1"
          cd "$$dir"
          if ! terraform init -input=false >> /tmp/tf_init.log 2>&1; then
            echo "  ⚠️  Failed to initialize Terraform in $$dir"
          fi
          terraform workspace list 2>/dev/null | sed 's/^[* ]*//' | awk 'NF'
        }

        # Function to run terraform plan and capture drift
        run_terraform_plan() {
          local dir="$$1"
          local repo_name="$$2"
          local workspace="$$3"
          local relative_path="$${dir#/workspace/repos/$$repo_name}"
          relative_path="$${relative_path#/}"
          if [ -z "$$relative_path" ]; then
            relative_path="(root)"
          fi
          
          echo "Running Terraform plan in: $$dir (workspace: $$workspace)"
          cd "$$dir"
          
          # Select workspace if not default
          if [ "$$workspace" != "default" ]; then
            terraform workspace select "$$workspace" > /dev/null 2>&1 || {
              echo "  ⚠️  Failed to select workspace: $$workspace"
              return 1
            }
          fi
          
          # Run plan and capture output
          if terraform plan -detailed-exitcode -no-color -out=/tmp/tfplan > /tmp/tf_plan.log 2>&1; then
            echo "  ✓ No drift detected"
            return 0
          else
            exit_code=$$?
            if [ $$exit_code -eq 2 ]; then
              echo "  ⚠️  DRIFT DETECTED!"
              echo "true" > /workspace/drift_detected.txt
              
              # Create simplified drift entry
              jq -n \
                --arg repo "$$repo_name" \
                --arg path "$$relative_path" \
                --arg workspace "$$workspace" \
                --arg type "terraform" \
                '{repository: $$repo, path: $$path, workspace: $$workspace, type: $$type}' \
                >> /workspace/drift_entries.ndjson
              
              return 2
            else
              echo "  ⚠️  Plan failed with exit code: $$exit_code"
              echo "##### START PLAN LOG ####"
              cat /tmp/tf_plan.log
              echo "##### END PLAN LOG ####"
              return 1
            fi
          fi
        }

        # Function to run terragrunt plan and capture drift
        run_terragrunt_plan() {
          local dir="$$1"
          local repo_name="$$2"
          local relative_path="$${dir#/workspace/repos/$$repo_name}"
          relative_path="$${relative_path#/}"
          if [ -z "$$relative_path" ]; then
            relative_path="(root)"
          fi
          
          echo "Running Terragrunt plan in: $$dir"
          cd "$$dir"
          
          # Run terragrunt plan
          if terragrunt plan -detailed-exitcode -no-color -out=/tmp/tgplan > /tmp/tg_plan.log 2>&1; then
            echo "  ✓ No drift detected"
            return 0
          else
            exit_code=$$?
            if [ $$exit_code -eq 2 ]; then
              echo "  ⚠️  DRIFT DETECTED!"
              echo "true" > /workspace/drift_detected.txt
              
              # Create simplified drift entry
              jq -n \
                --arg repo "$$repo_name" \
                --arg path "$$relative_path" \
                --arg workspace "default" \
                --arg type "terragrunt" \
                '{repository: $$repo, path: $$path, workspace: $$workspace, type: $$type}' \
                >> /workspace/drift_entries.ndjson
              
              return 2
            else
              echo "  ⚠️  Plan failed with exit code: $$exit_code"
              return 1
            fi
          fi
        }

        # Initialize drift entries file
        echo "" > /workspace/drift_entries.ndjson

        # Process each repository
        echo '${_REPOSITORIES}' | jq -c '.[]' | while IFS= read -r repo; do
          repo_name=$(echo "$$repo" | jq -r '.name')
          repo_type=$(echo "$$repo" | jq -r '.type')
          repo_path="/workspace/repos/$$repo_name"
          
          echo ""
          echo "================================================"
          echo "Processing repository: $$repo_name (type: $$repo_type)"
          echo "================================================"
          
          if [ ! -d "$$repo_path" ]; then
            echo "⚠️  Repository path not found: $$repo_path"
            continue
          fi
          
          if [ "$$repo_type" = "terraform" ]; then
            # Find all directories with main.tf
            tf_dirs=$(find_terraform_dirs "$$repo_path")
            
            if [ -z "$$tf_dirs" ]; then
              echo "No main.tf files found in $$repo_name"
              continue
            fi
            
            echo "$$tf_dirs" | while IFS= read -r tf_dir; do
              # Get all workspaces for this directory
              workspaces=$(get_workspaces "$$tf_dir")
              echo "$$workspaces" | while IFS= read -r workspace; do
                run_terraform_plan "$$tf_dir" "$$repo_name" "$$workspace" || true
              done
            done
            
          elif [ "$$repo_type" = "terragrunt" ]; then
            # Find all directories with terragrunt.hcl
            tg_dirs=$(find_terragrunt_dirs "$$repo_path")
            
            if [ -z "$$tg_dirs" ]; then
              echo "No terragrunt.hcl files found in $$repo_name"
              continue
            fi
            
            echo "$$tg_dirs" | while IFS= read -r tg_dir; do
              run_terragrunt_plan "$$tg_dir" "$$repo_name" || true
            done
          else
            echo "⚠️  Unknown repository type: $$repo_type"
          fi
        done

        # Consolidate drift entries into JSON array
        if [ -s /workspace/drift_entries.ndjson ]; then
          jq -s '.' /workspace/drift_entries.ndjson > /workspace/drift_report.json
        else
          echo "[]" > /workspace/drift_report.json
        fi

        echo ""
        echo "================================================"
        echo "Drift Detection Summary"
        echo "================================================"
        drift_detected=$(cat /workspace/drift_detected.txt)
        if [ "$$drift_detected" = "true" ]; then
          echo "⚠️  DRIFT DETECTED in one or more repositories"
          jq -r '.[] | "  - \(.repository)/\(.path) (workspace: \(.workspace), type: \(.type))"' /workspace/drift_report.json
        else
          echo "✓ No drift detected across all repositories"
        fi

  # Send notifications (always runs, even if previous steps fail)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'send-notification'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e

        apt-get update && apt-get install -y jq
        
        # Check if drift detection completed successfully
        if [ ! -f /workspace/drift_detected.txt ]; then
          # Pipeline failed before drift detection completed
          WEBHOOK_URL=$(gcloud secrets versions access latest --secret=${_CHAT_WEBHOOK_SECRET})
          
          FAILURE_PAYLOAD=$(jq -n \
            --arg project "$$PROJECT_ID" \
            --arg build_id "${BUILD_ID}" \
            '{
              "text": "❌ *Drift Detection Pipeline Failed*",
              "cards": [
                {
                  "header": {
                    "title": "❌ Pipeline Execution Error",
                    "subtitle": "Drift detection could not complete",
                    "imageUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/alert/error/materialicons/24dp/2x/baseline_error_black_24dp.png"
                  },
                  "sections": [
                    {
                      "widgets": [
                        {
                          "textParagraph": {
                            "text": "<font color=\"#EA4335\"><b>❌ Pipeline execution failed</b></font><br>The drift detection pipeline encountered an error and could not complete successfully. Please check the build logs for details."
                          }
                        }
                      ]
                    },
                    {
                      "widgets": [
                        {
                          "keyValue": {
                            "topLabel": "Build ID",
                            "content": $build_id
                          }
                        }
                      ]
                    },
                    {
                      "widgets": [
                        {
                          "buttons": [
                            {
                              "textButton": {
                                "text": "📋 View Build Logs",
                                "onClick": {
                                  "openLink": {
                                    "url": "https://console.cloud.google.com/cloud-build/builds;region=global/\($build_id)?project=\($project)"
                                  }
                                }
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }')
          
          echo "$$FAILURE_PAYLOAD" | curl -sS -X POST -H 'Content-Type: application/json' "$$WEBHOOK_URL" -d @-
          echo "Failure notification sent"
          exit 0
        fi
        
        DRIFT_DETECTED=$(cat /workspace/drift_detected.txt)
        WEBHOOK_URL=$(gcloud secrets versions access latest --secret=${_CHAT_WEBHOOK_SECRET})
        
        if [ "$$DRIFT_DETECTED" = "true" ]; then
          # Read drift report
          DRIFT_REPORT=$(cat /workspace/drift_report.json)
          DRIFT_COUNT=$(echo "$$DRIFT_REPORT" | /usr/bin/jq 'length')
          DRIFT_DETAILS=$(
            echo "$$DRIFT_REPORT" | /usr/bin/jq -r '.[] | 
              "• <b>Repo:</b> \(.repository)<br>  <b>Path:</b> \(.path)<br>  <b>Workspace:</b> \(.workspace)<br>  <b>Type:</b> \(.type)"' | 
            tr '\n' ' ' | sed 's/<br> /<br>/g'
          )
          
          if [ -z "$$DRIFT_DETAILS" ]; then
            DRIFT_DETAILS="No detailed information available"
          fi
          
          # Create notification payload
          NOTIFICATION_PAYLOAD=$(jq -n \
            --arg project "$$PROJECT_ID" \
            --arg count "$$DRIFT_COUNT" \
            --arg details "$$DRIFT_DETAILS" \
            '{
              "text": "⚠️ *Terraform Drift Detected*",
              "cards": [
                {
                  "header": {
                    "title": "🔍 Drift Detection Report",
                    "subtitle": "Found \($count) location(s) with configuration drift",
                    "imageUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/alert/warning_amber/materialicons/24dp/2x/baseline_warning_amber_black_24dp.png"
                  },
                  "sections": [
                    {
                      "widgets": [
                        {
                          "textParagraph": {
                            "text": "<font color=\"#FF0000\"><b>⚠️ Configuration drift detected!</b></font><br>The following locations have differences between code and infrastructure state:"
                          }
                        }
                      ]
                    },
                    {
                      "widgets": [
                        {
                          "textParagraph": {
                            "text": $details
                          }
                        }
                      ]
                    },
                    {
                      "widgets": [
                        {
                          "buttons": [
                            {
                              "textButton": {
                                "text": "📋 View Build Logs",
                                "onClick": {
                                  "openLink": {
                                    "url": "https://console.cloud.google.com/cloud-build/builds;region=global/${BUILD_ID}?project=\($project)"
                                  }
                                }
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }')
          
          echo "$$NOTIFICATION_PAYLOAD" | curl -sS -X POST -H 'Content-Type: application/json' "$$WEBHOOK_URL" -d @-
          
        else
          # No drift detected
          SUCCESS_PAYLOAD=$(jq -n \
            --arg project "$$PROJECT_ID" \
            '{
              "text": "✅ *No Drift Detected*",
              "cards": [
                {
                  "header": {
                    "title": "✅ Infrastructure In Sync",
                    "subtitle": "All repositories match their infrastructure state",
                    "imageUrl": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/check_circle/materialicons/24dp/2x/baseline_check_circle_black_24dp.png"
                  },
                  "sections": [
                    {
                      "widgets": [
                        {
                          "textParagraph": {
                            "text": "<font color=\"#34A853\"><b>✓ No configuration drift detected</b></font><br>All monitored repositories are in sync with their infrastructure state."
                          }
                        }
                      ]
                    },
                    {
                      "widgets": [
                        {
                          "buttons": [
                            {
                              "textButton": {
                                "text": "📋 View Build Logs",
                                "onClick": {
                                  "openLink": {
                                    "url": "https://console.cloud.google.com/cloud-build/builds;region=global/${BUILD_ID}?project=\($project)"
                                  }
                                }
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }')
          
          echo "$$SUCCESS_PAYLOAD" | curl -sS -X POST -H 'Content-Type: application/json' "$$WEBHOOK_URL" -d @-
        fi
        
        echo "Notification sent successfully"

  # Failure notification handler - only runs if any previous step fails
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'send-failure-notification'
    entrypoint: 'sh'
    waitFor: ['-']  # Run independently, don't wait for previous steps
    args:
      - '-c'
      - |
        # This step only executes when the build fails
        # Cloud Build will trigger this automatically with the status check below
        echo "This step should not run on success"
        exit 0

substitutions:
  _TERRAFORM_VERSION: '1.5.7'
  _TERRAGRUNT_VERSION: '0.88.1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'

timeout: '3600s'